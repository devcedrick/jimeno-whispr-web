title = "Whispr secret scanning"

# Start from the maintained default ruleset, so new secret types are covered
# automatically, and only add project-specific allowlists below.
[extend]
useDefault = true

[allowlist]
description = "Known placeholders and generated files"

paths = [
  '''package-lock\.json''',
  '''pnpm-lock\.yaml''',
  '''yarn\.lock''',
  '''\.env\.example''',
]

regexes = [
  '''ci-placeholder-anon-key''',
  '''your_supabase_project_url''',
  '''your_supabase_anon_key''',
  '''your_upstash_redis_url''',
  '''your_upstash_redis_token''',
]
